# ВРЕМЕННЫЙ: проверка, отвечает ли РУЗ САФУ серверам GitHub. Удалить после проверки.
name: Проверка доступа к РУЗ

on:
  push:
    branches: [claude/nifty-pascal-ct9x4j]
    paths: [.github/workflows/ruz-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Запрос страницы группы
        run: |
          mkdir out
          UA="Zachetka-schedule (+https://github.com/ZooM-Koji/Project_himself)"
          for name in "ics:https://ruz.narfu.ru/?icalendar&oid=21077&cod=171606"; do
            key="${name%%:*}"; url="${name#*:}"
            code=$(curl -sS -m 30 -A "$UA" -o "out/$key.txt" -w '%{http_code}' "$url" || echo ERR)
            echo "$key $url -> $code ($(wc -c < out/$key.txt 2>/dev/null) bytes)"
          done
          curl -sS -m 10 https://ipinfo.io/country || true
      - uses: actions/upload-artifact@v4
        with:
          name: ruz-pages
          path: out
