# Сборка и публикация на GitHub Pages при каждом пуше в main.
name: Деплой на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # кнопка «Run workflow» для ручного запуска
  workflow_call: # вызывается из schedule.yml после обновления расписания

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Свежая версия ветки: после schedule.yml там уже лежит новый schedule.json
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
